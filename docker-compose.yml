services:
  ao3-viewer:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      - DOWNLOAD_DIR=/downloads
      - LOG_PATH=/logs/log.jsonl
      - DB_PATH=/data/app.db
      - AUTO_REFRESH_INTERVAL_SECONDS=${AUTO_REFRESH_INTERVAL_SECONDS:-3600}
      # Optional Audiobookshelf integration -- see README. Blank disables it.
      - ABS_BASE_URL=${ABS_BASE_URL:-}
      - ABS_LIBRARY_ID=${ABS_LIBRARY_ID:-}
      # Optional: lets the Queue page's download worker log in to AO3 --
      # see README. Blank downloads only public works, unauthenticated.
      - AO3_USERNAME=${AO3_USERNAME:-}
      - AO3_PASSWORD=${AO3_PASSWORD:-}
      - AO3_EXTRA_WAIT_SECONDS=${AO3_EXTRA_WAIT_SECONDS:-2}
      # Optional: a second, read-only downloads folder -- see
      # MANUAL_DOWNLOAD_DIR in .env.example. Uncomment this and the
      # matching volume line below to enable it.
      # - MANUAL_DOWNLOAD_DIR=/manual-downloads
      # Zone this container's own clock runs in -- file mtimes and this
      # app's own recorded timestamps are all in this zone. Defaults to
      # UTC if unset. Each account's own *display* timezone is a separate
      # setting under Account -- this only matters if you want the
      # underlying recorded times themselves to be in a specific zone.
      - TZ=${TZ:-UTC}
    volumes:
      # No longer read-only: the app can now download works itself (see
      # the Queue page and AO3_USERNAME/AO3_PASSWORD in README) and writes
      # new .epub files and log.jsonl entries into these same folders,
      # exactly like a manual ao3downloader run would.
      - ${DOWNLOAD_DIR}:/downloads
      - ${LOG_DIR}:/logs
      - ${DATA_DIR}:/data
      # Uncomment and set ABS_DB_HOST_PATH in .env to enable Audiobookshelf
      # linking (a read-only mount of its absdatabase.sqlite):
      # - ${ABS_DB_HOST_PATH}:/abs/absdatabase.sqlite:ro
      # Uncomment and set MANUAL_DOWNLOAD_DIR in .env (and above) to scan a
      # second, read-only folder for manually-obtained files:
      # - ${MANUAL_DOWNLOAD_DIR}:/manual-downloads:ro
    restart: unless-stopped
