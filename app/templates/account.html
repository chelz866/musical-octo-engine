{% extends "base.html" %}
{% block title %}Account - Archive Of My Own{% endblock %}
{% block content %}
  <header>
    <h1>Account</h1>
    <p class="paths">Logged in as <strong>{{ user.username }}</strong> ({{ user.role }}).</p>
  </header>

  {% if error %}<p class="badge badge-warn">{{ error }}</p>{% endif %}
  {% if saved %}<p class="badge badge-ok">Password updated.</p>{% endif %}

  <form method="post" action="/account/password" class="stacked-form">
    <label>Current password
      <input type="password" name="current_password" required>
    </label>
    <label>New password
      <input type="password" name="new_password" required minlength="4">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="4">
    </label>
    <button type="submit">Change Password</button>
  </form>
{% endblock %}
